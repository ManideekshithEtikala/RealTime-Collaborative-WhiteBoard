services:
  - type: web
    name: canvas-together
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DATA_DIR
        value: /data
    disk:
      name: whiteboard-data
      mountPath: /data
      sizeGB: 1
